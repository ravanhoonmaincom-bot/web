<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin-top: 20px;
      background: linear-gradient(145deg, #f6f0f3, #e8f3fc);
      height: 40vh;
      display: flex;
      justify-content: center;
      align-items: top;
    }

    .form-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.05);
      padding: 30px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .form-card .top-bar {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-card .top-bar span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .form-card .top-bar span.red { background: #ff5f56; }
    .form-card .top-bar span.yellow { background: #ffbd2e; }
    .form-card .top-bar span.green { background: #27c93f; }

    .form-card label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-card input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      transition: 0.3s;
    }

    .form-card input:focus {
      outline: none;
      border-color: #a084f9;
      box-shadow: 0 0 0 3px rgba(160, 132, 249, 0.2);
    }

    .form-card button {
      width: 100%;
      padding: 14px;
      background: #7b61ff;
      border: none;
      color: #fff;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .form-card button:hover {
      background: #6a52e8;
    }

    /* Popup styles */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 300px;
    }

    .popup-content h2 {
      margin: 0 0 10px;
      color: #4caf50;
    }

    .popup-content button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #7b61ff;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .popup-content button:hover {
      background: #6a52e8;
    }
  </style>
</head>
<body>

  <form class="form-card" id="myForm">
    <div class="top-bar">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>

    <label for="fullname">Full Name*</label>
    <input type="text" name="entry.605182424" id="fullname" placeholder="Type your name" required >

    <label for="email">Email*</label>
    <input type="email" name="entry.1070057513" id="email" placeholder="Type your email address" required>

    <button type="submit">Submit →</button>
  </form>

  <!-- Thank You Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h2>Thank You!</h2>
      <p>Your submission has been sent.</p>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("myForm");
    const popup = document.getElementById("popup");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const formData = new FormData(form);

      fetch("https://docs.google.com/forms/d/e/1FAIpQLSf1TNMpqVHgsvPRTSwNzws8SLc7k1fCpX0W_DX40yybcuH-kw/formResponse", {
        method: "POST",
        mode: "no-cors", // required to bypass CORS issues
        body: formData
      }).then(() => {
        popup.style.display = "flex";
        form.reset();
      }).catch((error) => {
        alert("Error submitting form. Please try again.");
        console.error("Form submission error:", error);
      });
    });

    function closePopup() {
      popup.style.display = "none";
    }
  </script>

</body>
</html>
